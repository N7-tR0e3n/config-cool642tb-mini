name: Build ZMK firmware

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    name: Build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache west modules
        uses: actions/cache@v4
        continue-on-error: true
        env:
          cache_name: cache-west-modules
        with:
          path: |
            zmk/
            zephyr/
            modules/
            zmk-west-commands/
            zmk-driver-pmw3610-with-custom-studio-rpc/
          key: ${{ runner.os }}-build-${{ env.cache_name }}-${{ hashFiles('config/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache_name }}-

      - name: Init
        run: |
          git config --global --add safe.directory '*'
          west init -l config
          west update --narrow
          west zephyr-export

      - name: Diagnose west zmk-build
        continue-on-error: true
        run: |
          echo "=== west version ==="
          west --version
          echo "=== west list ==="
          west list
          echo "=== zmk-build help ==="
          west zmk-build --help 2>&1 || echo "zmk-build not available"
          echo "=== zmk-build no-run ==="
          west zmk-build -d ./build --no-run 2>&1 || echo "zmk-build --no-run failed"

      - name: Build
        run: |
          ZMK_APP="${PWD}/zmk/app"
          CONFIG="${PWD}/config"
          PMW3610="${PWD}/zmk-driver-pmw3610-with-custom-studio-rpc"

          west build -s "${ZMK_APP}" -d build/cool642tb-mini_R    -b xiao_ble//zmk -S studio-rpc-usb-uart -p always -- \
            -DSHIELD=cool642tb-mini_R -DZMK_CONFIG="${CONFIG}" "-DZMK_EXTRA_MODULES=${PMW3610}"

          west build -s "${ZMK_APP}" -d build/cool642tb-mini_L    -b xiao_ble//zmk -p always -- \
            -DSHIELD=cool642tb-mini_L -DZMK_CONFIG="${CONFIG}" "-DZMK_EXTRA_MODULES=${PMW3610}"

          west build -s "${ZMK_APP}" -d build/cool642tb-mini_R-settings_reset -b xiao_ble//zmk -p always -- \
            -DSHIELD=cool642tb-mini_R -DZMK_CONFIG="${CONFIG}" "-DZMK_EXTRA_MODULES=${PMW3610}" \
            -DCONFIG_ZMK_SETTINGS_RESET_ON_START=y

          west build -s "${ZMK_APP}" -d build/cool642tb-mini_L-settings_reset -b xiao_ble//zmk -p always -- \
            -DSHIELD=cool642tb-mini_L -DZMK_CONFIG="${CONFIG}" "-DZMK_EXTRA_MODULES=${PMW3610}" \
            -DCONFIG_ZMK_SETTINGS_RESET_ON_START=y

      - name: Copy artifacts
        shell: sh -x {0}
        run: |
          mkdir -p artifacts
          find ./build -type f -path '*/zephyr/zmk.uf2' \
          | while read -r f; do
              echo "Found: $f"
              name=$(basename "$(dirname "$(dirname "$f")")")
              mv "$f" "artifacts/${name}.uf2"
            done

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cool642tb-mini
          path: artifacts
