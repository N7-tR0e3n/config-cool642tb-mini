# =============================================================================
# cool642tb-mini 左半体 (ペリフェラル側) 設定ファイル
# =============================================================================
# 左半体は BLE 接続、EC11 ロータリーエンコーダー搭載、ペリフェラルとして動作
# =============================================================================

# ==============================================================================
# 基本設定
# ==============================================================================
# NFC ピンを GPIO として使用 (nRF52840 の NFC 機能を無効化し、GPIO ピンとして利用)
# CONFIG_NFCT_PINS_AS_GPIOS=y
# CONFIG_NFC_PINS_AS_GPIOS=y

# ==============================================================================
# BLE設定
# ==============================================================================
# Bluetooth デバイス名の最大長 (30文字まで設定可能、右半体と同じ設定)
CONFIG_BT_DEVICE_NAME_MAX=30
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# ==============================================================================
# エンコーダー設定
# ==============================================================================
# EC11 ロータリーエンコーダーを有効化 (左半体に物理的に搭載)
CONFIG_EC11=y
# エンコーダーイベントをグローバルスレッドで処理 (BLE 経由で右半体に送信)
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ==============================================================================
# バッテリー報告設定
# ==============================================================================
# バッテリー残量報告を有効化 (左半体のバッテリー残量を測定)
CONFIG_ZMK_BATTERY_REPORTING=y
# ペリフェラル側から右半体へのバッテリー残量プロキシ
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=n
# セントラル側による左半体バッテリー残量の取得
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=n
# リチウムイオン電池の電圧ベースの残量計算モード
# CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_LITHIUM_VOLTAGE=y

# ==============================================================================
# スタックとバッファ
# ==============================================================================
# 設定保存のデバウンス時間 (10秒、頻繁な書き込みを防ぐ)
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

# ==============================================================================
# DYA Studio Core
# ==============================================================================
# カスタム設定機能を有効化 (Studio から編集可能な独自設定項目)
# テストB: 左手では不要
CONFIG_ZMK_CUSTOM_SETTINGS=n
# Fast Keymap を有効化 (高速なキーマップ処理)
# テストB
CONFIG_ZMK_FAST_KEYMAP=n
# Fast Keymap のデフォルトレイヤー機能
# テストB
CONFIG_ZMK_FAST_KEYMAP_DEFAULT_LAYER=n

# ==============================================================================
# DYA Studio Keymap Macro Combo
# ==============================================================================
# 左半体のキー押下も Studio に送信
# テストB
CONFIG_ZMK_INPUT_STREAM_FEATURE=n
# 左半体のエンコーダーを Studio に表示
# テストB
CONFIG_ZMK_PHYSICAL_LAYOUTS_FEATURE=n

# ==============================================================================
# DYA Studio Diagnostics Development
# ==============================================================================
# テストB
CONFIG_ZMK_DEVICE_INFO=n
# テストB（左手はStudio無効のため不要）
# CONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=y
CONFIG_ZMK_WATCHDOG=y
# 左手はStudio無効のため不要（記録は右手経由で読む）
# CONFIG_ZMK_WATCHDOG_STUDIO_RPC=y
CONFIG_ZMK_WATCHDOG_SPLIT_RELAY=y
CONFIG_ZMK_WATCHDOG_FREEZE_DETECT=n
CONFIG_THREAD_NAME=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS=n
CONFIG_ZMK_KSCAN_DIAGNOSTICS_SPLIT=n
# watchdog の左右中継に必要（以前は kscan 診断が自動で有効にしていた）
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240