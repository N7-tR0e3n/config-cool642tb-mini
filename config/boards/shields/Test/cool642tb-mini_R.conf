# =============================================================================
# cool642tb-mini 右半体 (セントラル側) 設定ファイル
# =============================================================================
# 右半体は USB 接続、PMW3610 トラックボール搭載、BLE セントラルとして動作
# =============================================================================

# ==============================================================================
# 基本設定
# ==============================================================================
# キーボード名 (BLE 接続時に表示される名前)
CONFIG_ZMK_KEYBOARD_NAME="cool642tb-mini"
# NFC ピンを GPIO として使用 (nRF52840 の NFC 機能を無効化し、GPIO ピンとして利用)
# CONFIG_NFCT_PINS_AS_GPIOS=y
# CONFIG_NFC_PINS_AS_GPIOS=y
# 右半体をセントラル（USB 接続側）として動作させる
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
# USB 機能を有効化 (PC/Mac との通信、ZMK Studio 接続に必要)
CONFIG_ZMK_USB=y

# ==============================================================================
# BLE設定
# ==============================================================================
# Bluetooth デバイス名の最大長 (30文字まで設定可能)
CONFIG_BT_DEVICE_NAME_MAX=30
# BLE (Bluetooth Low Energy) 機能を有効化 (分割キーボードの左右通信に使用)
CONFIG_ZMK_BLE=y
# CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
# CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# ==============================================================================
# ポインティングデバイス設定
# ==============================================================================
# マウス機能を有効化 (トラックボールによるマウス操作を可能にする)
CONFIG_ZMK_POINTING=y
# SPI バスを有効化 (PMW3610 トラックボールとの通信に使用)
CONFIG_SPI=y
# 入力デバイスサブシステムを有効化 (トラックボール、エンコーダーなどの入力処理)
CONFIG_INPUT=y

# ==============================================================================
# PMW3610 トラックボール設定
# ==============================================================================
# PMW3610 ドライバーを有効化
CONFIG_PMW3610=y
# # CPI (Counts Per Inch): カーソル感度 (600 = 標準的な感度)
# CONFIG_PMW3610_CPI=600
# # CPI 除数 (1 = そのまま、2 = 半分の感度、実効 CPI = CPI / DIVIDOR)
# CONFIG_PMW3610_CPI_DIVIDOR=1
# # センサーの向きを 180度回転 (トラックボールの取り付け向きに応じて調整)
# CONFIG_PMW3610_ORIENTATION_180=y
# CONFIG_PMW3610_SWAP_XY=y
# # スクロールティック (1スクロール単位に必要な移動量、16 = 適度な感度)
# CONFIG_PMW3610_SCROLL_TICK=16
# X軸方向の反転 (n = 反転しない、通常の左右移動)
CONFIG_PMW3610_INVERT_X=n
# Y軸方向の反転 (y = 反転する、上下移動の方向を調整)
CONFIG_PMW3610_INVERT_Y=y
# # スクロール時の X軸反転 (y = 反転する、水平スクロールの方向調整)
# CONFIG_PMW3610_INVERT_SCROLL_X=y
# RUN モードからダウンシフトするまでの時間 (3264ms = 約3秒、省電力モードへの移行時間)
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
# REST1 モードのサンプリング間隔 (20ms = 50Hz、低消費電力時のポーリングレート)
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
# # ソフトウェアポーリングレート 125Hz (y = 有効、8ms 間隔でセンサーをポーリング)
# CONFIG_PMW3610_POLLING_RATE_125_SW=y
# # オートマウスレイヤーのタイムアウト (800ms 操作がないと元のレイヤーに戻る)
# CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=800
# # 移動検出の閾値 (2 = 微小な動きは無視、意図的な操作のみ検出)
# CONFIG_PMW3610_MOVEMENT_THRESHOLD=2
# スマートアルゴリズムを有効化 (センサーの最適化処理を自動で行う)
CONFIG_PMW3610_SMART_ALGORITHM=y

# DYA Studio から USB 経由で PMW3610 の設定を読み書き可能にする
CONFIG_ZMK_PMW3610_STUDIO_RPC=y
# PMW3610 の設定を NVRAM に保存し、Studio から編集可能にする
CONFIG_ZMK_PMW3610_CUSTOM_SETTINGS=y
# Studio から Input Processor の設定を動的に編集可能にする
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
# Studio RPC 経由で Input Processor の設定を送受信
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y

# ==============================================================================
# エンコーダー設定
# ==============================================================================
# EC11 ロータリーエンコーダーを有効化 (左半体にも搭載、右半体でも設定必要)
CONFIG_EC11=y
# エンコーダーイベントをグローバルスレッドで処理 (BLE 経由の左半体エンコーダーも処理)
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ==============================================================================
# バッテリー報告設定
# ==============================================================================
# バッテリー残量報告を有効化 (BLE 経由で PC/Mac に残量を通知)
CONFIG_ZMK_BATTERY_REPORTING=y
# セントラル側が左半体のバッテリー残量を PC に転送する機能
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=n
# セントラル側が左半体のバッテリー残量を取得する機能
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=n

# ==============================================================================
# ZMK Studio
# ==============================================================================
# ZMK Studioを有効化
CONFIG_ZMK_STUDIO=y
# Studio のロック機能
CONFIG_ZMK_STUDIO_LOCKING=y

# ==============================================================================
# スタックとバッファ
# ==============================================================================
# セントラル→ペリフェラル方向へのイベント中継を有効化
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
# Split イベント中継のデータ長 (240バイト、Studio RPC データの中継に使用)
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240
# BLE セントラルの Split 通信スタックサイズ (768バイト、左半体との通信用)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=1024
# Studio RPC 受信バッファサイズ (256バイト、USB 経由の Studio 通信用)
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256
# Studio RPC 送信バッファサイズ (256バイト、USB 経由の Studio 通信用)
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
# Studio RPC カスタムサブシステムのリクエストペイロード最大サイズ
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=256
# Studio RPC スレッドのスタックサイズ (6000バイト、大きめに確保)
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=6000
# 設定保存のデバウンス時間 (10秒、頻繁な書き込みを防ぐ)
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
# 低優先度スレッドのスタックサイズ (4096バイト)
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
# システムワークキューのスタックサイズ (4096バイト)
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
# カスタム設定の大きな値の最大サイズ (256バイト)
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256

# ==============================================================================
# DYA Studio Core
# ==============================================================================
# カスタム設定機能を有効化 (Studio から編集可能な独自設定項目)
CONFIG_ZMK_CUSTOM_SETTINGS=y
# Fast Keymap を有効化 (高速なキーマップ処理)
CONFIG_ZMK_FAST_KEYMAP=y
# キーマップ設定の永続化ストレージを有効化 (Fast Keymap の依存関係)
CONFIG_ZMK_KEYMAP_SETTINGS_STORAGE=y
# Fast Keymap のデフォルトレイヤー機能
CONFIG_ZMK_FAST_KEYMAP_DEFAULT_LAYER=y
# カスタム設定の Studio RPC (USB 経由の Studio 通信)
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
# Fast Keymap の Studio RPC
CONFIG_ZMK_FAST_KEYMAP_STUDIO_RPC=y
# カスタム設定の Split RPC 中継 (左半体の設定も Studio から編集可能に)
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y

# ==============================================================================
# DYA Studio Keymap Macro Combo
# ==============================================================================
# Studio から動的にマクロを編集・実行可能にする
CONFIG_ZMK_RUNTIME_MACRO=y
# ランタイムマクロの Studio RPC (USB 経由で Studio と通信)
CONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=y
# Studio から動的にコンボ (複数キー同時押し) を編集可能にする
CONFIG_ZMK_RUNTIME_COMBO=y
# ランタイムコンボの Studio RPC
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y
# Studio でキー押下をリアルタイム表示 (デバッグ・テスト用)
CONFIG_ZMK_INPUT_STREAM_FEATURE=y
# 入力ストリームの Studio RPC
CONFIG_ZMK_INPUT_STREAM_FEATURE_STUDIO_RPC=y
# Studio でトラックボール・エンコーダーを表示
CONFIG_ZMK_PHYSICAL_LAYOUTS_FEATURE=y
# 物理レイアウトの Studio RPC
CONFIG_ZMK_PHYSICAL_LAYOUTS_FEATURE_STUDIO_RPC=y

# ==============================================================================
# DYA Studio Rotary Encoder
# ==============================================================================
# Enable the runtime sensor rotate module
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE=y
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE_STUDIO_RPC=y

# ==============================================================================
# DYA Studio Diagnostics Development
# ==============================================================================
CONFIG_ZMK_DEVICE_INFO=y
CONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=y
CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_WATCHDOG_STUDIO_RPC=y
CONFIG_ZMK_WATCHDOG_SPLIT_RELAY=y
CONFIG_ZMK_WATCHDOG_FREEZE_DETECT=n
CONFIG_ZMK_KSCAN_DIAGNOSTICS=n
CONFIG_ZMK_KSCAN_DIAGNOSTICS_SPLIT=n
CONFIG_ZMK_KSCAN_DIAGNOSTICS_STUDIO_RPC=n
CONFIG_ZMK_DEVTOOL=n
CONFIG_ZMK_DEVTOOL_STUDIO_RPC=n
CONFIG_ZMK_DEVTOOL_STACK_USAGE=n

# ==============================================================================
# DYA OS
# ==============================================================================
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y

CONFIG_ZMK_DEFAULT_LAYER=n
# CONFIG_ZMK_DEFAULT_LAYER_MIN_INDEX=0
# CONFIG_ZMK_DEFAULT_LAYER_MAX_INDEX=4
CONFIG_ZMK_DEFAULT_LAYER_STUDIO_RPC=n
CONFIG_ZMK_DEFAULT_LAYER_OS_DETECTION=n

CONFIG_ZMK_OS_DETECTION=n
CONFIG_ZMK_OS_DETECTION_USB=n
CONFIG_ZMK_OS_DETECTION_BLE=n
CONFIG_ZMK_OS_DETECTION_STUDIO_RPC=n

# ==============================================================================
# DYA Settings
# ==============================================================================
# スリープまでの時間を設定する
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y
# より高度な設定を変更する
# CONFIG_ZMK_CUSTOM_SETTINGS=n
# CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=n
# CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=n